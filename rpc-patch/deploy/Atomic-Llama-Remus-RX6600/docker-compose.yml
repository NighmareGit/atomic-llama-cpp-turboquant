services:
  # First phase: standalone llama-server on remus RX6600
  rx6600-llama-server:
    container_name: rx6600-llama-server
    image: atomic-llama-remus-rx6600-server:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=0
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
    volumes:
      # Mount models here after copying from romulus (or use network share later)
      - /home/hunter/models:/models:ro
    command: ["-m", "/models/Qwen3.5-4B-Q4_K_M.gguf", "-ngl", "99", "-c", "4096",
              "-ctk", "q8_0", "-ctv", "q8_0",
              "--host", "0.0.0.0", "--port", "8080", "--no-warmup", "-np", "1",
              "--ctx-checkpoints", "0"]

  # Later phase: rpc-server worker for romulus client
  rx6600-rpc:
    container_name: rx6600-rpc
    image: atomic-llama-remus-rx6600-rpc:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    environment:
      - HIP_VISIBLE_DEVICES=0
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
    command: ["-H", "0.0.0.0", "-p", "${RPC_PORT:-50051}", "-d", "ROCm0"]
