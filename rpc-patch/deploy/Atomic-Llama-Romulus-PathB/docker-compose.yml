services:
  pathb-rpc-romulus:
    container_name: pathb-rpc-romulus
    image: atomic-llama-romulus-pathb-rpc:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus:
      - driver: nvidia
        count: 1
        capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
      - CUDA_VISIBLE_DEVICES=${CUDA_DEVICE:-0}
      - GGML_CUDA_DISABLE_GRAPHS=${GGML_CUDA_DISABLE_GRAPHS:-}
      - GGML_RPC_DEBUG=${GGML_RPC_DEBUG:-}
    command: ["-H", "0.0.0.0", "-p", "${RPC_PORT:-50051}", "-d", "CUDA0"]