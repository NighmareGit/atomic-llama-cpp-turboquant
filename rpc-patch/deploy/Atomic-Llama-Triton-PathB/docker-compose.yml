# One rpc-server container per GPU (3090 :50054, 3070 :50055).
# Avoids multi-device single-endpoint RPC; each container sees one GPU as CUDA0.
services:
  pathb-rpc-triton-3090:
    container_name: pathb-rpc-triton-3090
    image: atomic-llama-triton-pathb-rpc:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus:
      - driver: nvidia
        device_ids: ["0"]
        capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_DISABLE_GRAPHS=${GGML_CUDA_DISABLE_GRAPHS:-}
      - GGML_RPC_DEBUG=${GGML_RPC_DEBUG:-}
    command: ["-H", "0.0.0.0", "-p", "50054", "-d", "CUDA0"]

  pathb-rpc-triton-3070:
    container_name: pathb-rpc-triton-3070
    image: atomic-llama-triton-pathb-rpc:latest
    network_mode: host
    ipc: host
    restart: unless-stopped
    gpus:
      - driver: nvidia
        device_ids: ["1"]
        capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - GGML_CUDA_DISABLE_GRAPHS=${GGML_CUDA_DISABLE_GRAPHS:-}
      - GGML_RPC_DEBUG=${GGML_RPC_DEBUG:-}
    command: ["-H", "0.0.0.0", "-p", "50055", "-d", "CUDA0"]